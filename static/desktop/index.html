<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一帧成片</title>
<link rel="stylesheet" href="desktop.css">
</head>
<body>
<!-- 菜单栏 -->
<div class="menubar">
  <div class="menu" data-menu="file"><span>文件</span>
    <div class="menu-dd">
      <div class="mi" data-act="new">新建项目 <span class="hk">Ctrl+N</span></div>
      <div class="mi" data-act="openfolder">打开成片所在文件夹</div>
      <div class="sep"></div>
      <div class="mi" data-act="exit">退出</div>
    </div>
  </div>
  <div class="menu" data-menu="edit"><span>编辑</span>
    <div class="menu-dd">
      <div class="mi" data-act="undo">撤销 <span class="hk">Ctrl+Z</span></div>
      <div class="mi" data-act="redo">重做 <span class="hk">Ctrl+Y</span></div>
      <div class="sep"></div>
      <div class="mi" data-act="addcap">在指针处添加字幕</div>
      <div class="mi" data-act="delcap">删除选中段 <span class="hk">Del</span></div>
    </div>
  </div>
  <div class="menu" data-menu="view"><span>视图</span>
    <div class="menu-dd">
      <div class="mi" data-act="tgnarr">解说轨：开</div>
      <div class="mi" data-act="tgorig">原声轨：开</div>
    </div>
  </div>
  <div class="menu" data-menu="help"><span>帮助</span>
    <div class="menu-dd">
      <div class="mi" data-act="about">关于一帧成片</div>
    </div>
  </div>
  <span class="menu-title">一帧成片</span>
</div>

<!-- 工具栏 -->
<div class="toolbar">
  <span class="proj-name" id="projName">未打开项目</span>
  <span class="tb-sep"></span>
  <button class="tb-btn primary" id="tbGenerate">🎙 生成方案</button>
  <button class="tb-btn" id="tbCompose" disabled>🎬 合成视频</button>
  <span class="tb-flex"></span>
  <button class="tb-btn" id="tbSrt" title="导入 SRT 字幕文件（字幕是命脉：剧情理解准+时间轴零偏差）">📄 导入字幕</button>
  <button class="tb-btn" id="tbMusic" title="选择本地音乐文件（加配乐）">🎵 配乐</button>
  <button class="tb-btn tgl on" id="tbNarr" title="整条解说配音轨开关">🎙 解说轨</button>
  <button class="tb-btn tgl on" id="tbOrig" title="整条原片声音轨开关">🎬 原声轨</button>
  <button class="tb-btn" id="tbSettings" title="AI 配置：Key / 模型 / Whisper 下载">⚙ 设置</button>
</div>

<!-- 主工作区 -->
<div class="work">
  <!-- 新建项目（无项目时显示） -->
  <div class="newproj" id="newProj">
    <div class="np-card">
      <div class="np-logo">🎬</div>
      <div class="np-title">新建解说项目</div>
      <div class="np-sub">选择一段本地视频，写下剧情——AI 按剧情挑画面、写解说、配音，全程本地免费</div>
      <button class="np-pick" id="npPick">
        <span class="np-pick-icon">📁</span>
        <span id="npPickLabel">从电脑选择视频</span>
      </button>
      <div class="field">
        <label>片名 / 主题（用于搜剧情，可留空）</label>
        <input type="text" id="npName" placeholder="例如：惩罚者 第一季第一集">
      </div>
      <div class="field">
        <label>剧情（开头 → 冲突 → 结局）或粘贴完整解说稿</label>
        <textarea id="npPlot" rows="7" placeholder="例如：深夜的港口，一艘货船悄悄离岸……"></textarea>
      </div>
      <div class="np-opts">
        <label class="chk"><input type="checkbox" id="npScript"> 这是写好的完整解说稿（AI 不改一字）</label>
        <label class="chk"><input type="checkbox" id="npCut" checked> 剧情精剪（保留高光，剪掉填充——成片约 10 分钟）</label>
        <label class="chk"><input type="checkbox" id="npBgm"> 加背景音乐（解说时自动闪避）</label>
      </div>
      <button class="btn primary big" id="npGo" disabled>🎙 开始生成</button>
      <div class="np-hint" id="npHint">选择视频并填写剧情后开始</div>
    </div>
  </div>

  <!-- 编辑器（项目加载后） -->
  <div class="editor" id="editor" style="display:none">
    <div class="ed-left">
      <div class="panel-head">字幕 <span class="ph-sub" id="capCount"></span></div>
      <div class="cap-tools">
        <button class="mini-btn" id="capAdd">➕ 指针处添加</button>
        <button class="mini-btn" id="capDel">🗑 删除选中</button>
      </div>
      <div class="cap-list" id="capList"></div>
    </div>
    <div class="ed-center">
      <div class="video-shell">
        <video id="pvVideo" playsinline></video>
        <div class="sub-overlay" id="subOverlay"></div>
      </div>
      <div class="tl-card">
        <div class="tl-head"><span>时间轴</span><span class="hint-inline">空格播放 · ←→ 跳转 · 点色块选中</span></div>
        <div class="tl-scroll" id="tlScroll"><div class="tl-inner" id="tlInner">
          <div class="tl-ruler" id="tlRuler"></div>
          <div class="tl-track" id="tlTrack"></div>
          <div class="tl-playhead" id="tlPlayhead"></div>
        </div></div>
      </div>
    </div>
    <div class="ed-right">
      <div class="panel-head">检查器</div>
      <div class="ins-body" id="insBody">
        <div class="ins-empty">点选一段字幕</div>
      </div>
    </div>
  </div>
</div>

<!-- 状态栏 -->
<div class="statusbar">
  <span id="stState">● 就绪</span>
  <span id="stSeg"></span>
  <span class="sb-flex"></span>
  <span id="stEngine"></span>
  <span class="sb-flex"></span>
  <span id="stTime">00:00.0</span>
</div>

<!-- 生成进度浮层 -->
<div class="modal-mask" id="genMask" style="display:none">
  <div class="modal">
    <div class="modal-title" id="gmTitle">正在生成…</div>
    <div class="pbar big"><i id="gmFill"></i></div>
    <div class="modal-meta" id="gmMeta">准备中</div>
  </div>
</div>

<!-- 设置对话框 -->
<div class="modal-mask" id="settingsMask" style="display:none">
  <div class="modal settings">
    <div class="modal-title">⚙ 设置 <button class="mini-btn" id="settingsClose" style="float:right">✕</button></div>
    <div class="set-grid">
      <div class="set-sec">
        <div class="set-h">云端 Key（可选 · 配了自动用云端增强）</div>
        <label>看图写话 base_url</label>
        <input type="text" id="setVisBase" placeholder="https://api.deepseek.com/v1">
        <label>看图写话 Key</label>
        <input type="password" id="setVisKey" placeholder="已配置则留空">
        <label>看图模型</label>
        <input type="text" id="setVisModel" placeholder="gpt-4o / qwen-vl-plus">
      </div>
      <div class="set-sec">
        <div class="set-h">本地 Ollama</div>
        <label>地址</label>
        <input type="text" id="setLocalBase">
        <label>文字模型</label>
        <input type="text" id="setLocalModel" placeholder="qwen3:8b">
      </div>
      <div class="set-sec">
        <div class="set-h">Whisper 台词识别模型</div>
        <div class="set-row">
          <select id="setWhisperModel"></select>
          <button class="mini-btn" id="btnWhisperDl">📥 下载选中模型</button>
        </div>
        <div class="hint" id="whisperDlStatus"></div>
      </div>
    </div>
    <div class="set-actions">
      <button class="btn primary" id="settingsSave">💾 保存</button>
    </div>
  </div>
</div>

<script src="desktop.js"></script>
</body>
</html>
