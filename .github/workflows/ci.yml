# CI：回归测试 + 静态检查
# - pytest：tests/ 全量回归（重依赖已在测试内做函数级导入，CI 无需 GPU/模型）
# - flake8 --select=F：只查 pyflakes 类的静态问题（未用导入/未用变量/重复定义），
#   范围扩到**全仓**所有 Python 文件（2026-11-09 从 webui_server.py tests/ 扩围），
#   并尊重代码里已有的 `# noqa: F401`（有意的循环导入规避/加载顺序导入）
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-22.04 可正常为 setup-python 提供 3.9/3.11；ubuntu-latest(24.04) 无法在 1s 内
    # 拉起 Python 3.9（setup-python@v5 在该镜像上装 3.9 直接失败），故固定到 22.04。
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # README 声明 Python 3.9+，Docker 镜像用 3.11，两头都验证
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          python -c "import sys; print('PY', sys.version)"
          python -c "import imageio_ffmpeg; print('IMGFF', imageio_ffmpeg.__version__)"

      - name: flake8 静态检查（全仓）
        run: python -m flake8 --select=F .

      - name: pytest 回归测试
        run: |
          python -m pytest tests -q --tb=short --disable-warnings 2>&1 | tee pytest.log
          rc=${PIPESTATUS[0]}
          # 把失败/错误明细转成 GitHub annotation（页面可查，便于远程定位 Linux 环境失败）
          grep -E '^(FAILED|ERROR|E   )|assert ' pytest.log | sed 's/^/::error file=ci,line=1::/' | head -40 || true
          exit $rc
