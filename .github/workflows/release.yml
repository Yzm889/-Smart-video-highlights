# 一帧成片 · Windows 桌面版自动发布
# 触发：推送 v* 标签（如 v1.0.0）→ 构建 EXE → 挂到 GitHub Release
name: release-windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # v1.4.80 改为 3.13：3.11 打的包**窗口层启动失败**
          # （clr_loader 报 Failed to resolve Python.Runtime.Loader.Initialize），
          # 实测 3.11 包 _internal 只有 273 个文件、3.13 有 917 个（收集不完整），
          # 且塞了冲突的 api-ms-win-*/ucrtbase 转发器。本机 3.13 打包已
          # 3/3 稳定验证可启动，与主人日常源码态运行环境一致。
          # ⚠ 改回 3.11 前必须先用真机验证窗口能开（--selftest 不验窗口层）。
          python-version: '3.13'

      # 只装主程序运行所需（不装 torch：CosyVoice/ChatTTS 走各自 venv 子进程）
      - name: 安装依赖（版本锁定，见 requirements-build.txt）
        run: |
          pip install --no-cache-dir -r requirements-build.txt

      - name: 打包 EXE
        run: pyinstaller FrameCut.spec --noconfirm

      - name: 冒烟自检
        run: dist\FrameCut\FrameCut.exe --selftest

      # v1.4.82：CI runner 的 PyInstaller 会把 UCRT 转发器一并收进 _internal
      # （44 个 api-ms-win-*.dll + ucrtbase.dll），与系统 UCRT 冲突后 pythonnet
      # 报 Failed to resolve Python.Runtime.Loader.Initialize → 窗口层崩。
      # 本机 3.13 打的好包里这些文件是 0 个（实测对比），故打包后统一移除。
      # v1.4.81 就是漏了这一步，CI 却 success（见下方门禁的假阳性说明）。
      - name: 移除 CI 混入的 UCRT 转发器（否则 CLR 加载崩）
        shell: pwsh
        run: |
          $d = 'dist\FrameCut\_internal'
          $fwd = @(Get-ChildItem $d -Filter 'api-ms-win-*.dll' -ErrorAction SilentlyContinue)
          $u = Join-Path $d 'ucrtbase.dll'
          if (Test-Path $u) { Remove-Item $u -Force }
          foreach ($f in $fwd) { Remove-Item $f.FullName -Force }
          Write-Host "已移除 $($fwd.Count) 个 api-ms-win 转发器 + ucrtbase.dll"

      # v1.4.82：原门禁只轮询 8765 会**假阳性**——服务线程先起监听，窗口层随后
      # CLR 崩溃、进程退出（v1.4.81 就是这样被放行，发出了打不开窗口的包）。
      # 现在同时要求 8765 监听 + 启动日志里没有 CLR 崩溃 / 未处理异常。
      # CI runner 无桌面，WebView2 运行时缺失导致的降级不算失败（用户机器有）。
      - name: 窗口层真启动检查（起不来就不发版）
        shell: pwsh
        run: |
          $env:FRAMECUT_DATA_DIR = Join-Path $env:RUNNER_TEMP "fc_smoke"
          $log = Join-Path $env:RUNNER_TEMP "fc_launch.out"
          $errLog = Join-Path $env:RUNNER_TEMP "fc_launch.err"
          $p = Start-Process -FilePath "dist\FrameCut\FrameCut.exe" -PassThru `
                 -RedirectStandardOutput $log -RedirectStandardError $errLog
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            if (Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue) {
              $ok = $true; break
            }
            if ($p.HasExited) { break }
          }
          Start-Sleep -Seconds 6   # 给窗口层 CLR 初始化留出暴露崩溃的时间窗
          $text = ''
          foreach ($f in @($log, $errLog)) {
            if (Test-Path $f) { $text += (Get-Content $f -Raw -ErrorAction SilentlyContinue) }
          }
          $clrBad = $text -match 'Python\.Runtime\.Loader|Failed to execute script'
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok -or $clrBad) {
            Write-Error "窗口层启动失败（端口=$ok CLR崩溃=$clrBad），拒绝发版"
            if ($text) { Write-Host $text.Substring(0, [Math]::Min(3000, $text.Length)) }
            exit 1
          }
          Write-Host "窗口层启动 OK（8765 已监听、无 CLR 崩溃）"

      - name: 打 zip（排除 models：模型由应用运行时下载）
        shell: pwsh
        run: |
          if (Test-Path dist\FrameCut\_internal\models) { Remove-Item dist\FrameCut\_internal\models -Force }
          Compress-Archive -Path dist\FrameCut -DestinationPath "FrameCut-windows-x64-${{ github.ref_name }}.zip"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 一帧成片 ${{ github.ref_name }}
          body: |
            双击 FrameCut.exe 即可使用（首启自动打开应用窗口）。

            - 首次使用：进入「📖 新手引导」装 Ollama + 拉模型（或右上角 AI 配置）
            - AI 模型（Whisper 等）不打包在内，应用会在需要时自动下载到本目录
            - 解压后整个 FrameCut 文件夹放任意位置，删掉即卸载
          files: FrameCut-windows-x64-${{ github.ref_name }}.zip
